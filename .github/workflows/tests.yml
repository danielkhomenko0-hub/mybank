# Прогоняет все тесты при каждой загрузке кода на GitHub
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm install, а не npm ci: в lock-файле ganache есть пакет только для macOS
      - run: npm install --no-audit --no-fund
      - run: npm test
